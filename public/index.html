<style>
  :root {
    --ink: #0a0612;
    --ink-soft: #14102a;
    --bone: #f0ecf5;
    --bone-dim: #c4bcd9;
    --bone-faint: #8a82a3;
    --violet: #a855f7;
    --violet-deep: #6d28d9;
    --magenta: #c026d3;
    --glow: #d8b4fe;
    --green: #86efac;
    --line: rgba(216, 180, 254, 0.08);
    --line-strong: rgba(216, 180, 254, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-font-smoothing: antialiased; text-size-adjust: 100%; }

  body {
    background: var(--ink);
    color: var(--bone);
    font-family: 'Fraunces', serif;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% -5%, rgba(168, 85, 247, 0.20), transparent 55%),
      radial-gradient(ellipse 70% 50% at 80% 100%, rgba(192, 38, 211, 0.08), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.85 0 0 0 0 0.7 0 0 0 0 1 0 0 0 0.35 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.06;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 1;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 460px;
    margin: 0 auto;
    padding: 0 0 72px;
  }

  /* On a laptop, the column becomes a soft card floating on the gradient */
  @media (min-width: 700px) {
    .wrap {
      max-width: 520px;
      margin: 64px auto 80px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(16, 10, 30, 0.6);
      box-shadow:
        0 0 0 1px rgba(168, 85, 247, 0.06),
        0 48px 120px rgba(109, 40, 217, 0.22),
        0 12px 36px rgba(10, 6, 18, 0.6);
    }
  }

  .banner {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: linear-gradient(135deg, var(--violet-deep), var(--ink));
    opacity: 0;
    animation: rise 0.9s 0.05s ease forwards;
  }

  .banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
    filter: saturate(1.05) contrast(1.05);
  }

  .banner-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 30% 30%, rgba(168, 85, 247, 0.4), transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(192, 38, 211, 0.3), transparent 50%),
      var(--ink);
    color: var(--bone-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
  }

  .banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(10, 6, 18, 0.4) 70%, var(--ink));
    pointer-events: none;
  }

  .header-block {
    position: relative;
    z-index: 3;
    margin-top: -69px;
    padding: 0 24px;
    text-align: center;
    /* 37 not 44: the social row's 44px tap targets already add 7px below the icons */
    margin-bottom: 37px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 200;
    font-size: clamp(52px, 13vw, 76px);
    line-height: 0.94;
    letter-spacing: -0.045em;
    font-variation-settings: "opsz" 144;
    opacity: 0;
    animation: rise 0.8s 0.5s ease forwards;
    text-shadow: 0 4px 20px rgba(10, 6, 18, 0.6);
  }

  h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--glow);
  }

  .socials {
    display: flex;
    justify-content: center;
    align-items: center;
    /* small gap + 44px targets below = 26px of visual space between icons */
    gap: 4px;
    margin-top: 15px;
    opacity: 0;
    animation: rise 0.7s 0.65s ease forwards;
  }

  .socials a {
    color: var(--bone-dim);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .socials a:active { transform: scale(0.92); }
  @media (hover: hover) {
    .socials a:hover { color: var(--glow); transform: translateY(-2px); }
  }

  .socials svg {
    width: 22px;
    height: 22px;
    display: block;
  }

  .content { padding: 0 24px; }

  .section { margin-top: 44px; }
  .section:first-child { margin-top: 0; }

  /* Rhythm carries the grouping: "up next" stands on its own, the two
     listening sections read as a pair, booking sits apart again. */
  .section--live { margin-top: 72px; }
  .section--mixes { margin-top: 40px; }

  .section-label {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 17px;
    color: var(--bone-dim);
    margin-bottom: 14px;
    padding-left: 4px;
    opacity: 0;
    animation: rise 0.6s ease forwards;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  /* series name sitting beside the section heading, e.g. "up next  halloweekend" */
  .section-tag {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--glow);
    padding: 3px 8px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    line-height: 1;
    white-space: nowrap;
  }

  /* ---- up next hero ---- */

  /* Hero gigs render as a ticket: a tear-off date stub beside the details.
     Flat fills only — an earlier gradient version read as a generic
     AI-generated card, so keep gradients off this component. */
  .pinned {
    --stub-w: 78px;
    --notch: 9px;
    border: 1px solid var(--line-strong);
    background: rgba(168, 85, 247, 0.09);
    padding: 0;
    position: relative;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    transition: transform 0.3s ease, border-color 0.3s ease;
    opacity: 0;
    animation: rise 0.7s ease forwards;
    /* punch real holes at each end of the perforation */
    -webkit-mask-image:
      radial-gradient(circle var(--notch) at var(--stub-w) 0, transparent 98%, #000 100%),
      radial-gradient(circle var(--notch) at var(--stub-w) 100%, transparent 98%, #000 100%);
    mask-image:
      radial-gradient(circle var(--notch) at var(--stub-w) 0, transparent 98%, #000 100%),
      radial-gradient(circle var(--notch) at var(--stub-w) 100%, transparent 98%, #000 100%);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }

  .stub {
    position: relative;
    flex: 0 0 var(--stub-w);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 16px 0;
    background: rgba(168, 85, 247, 0.10);
    border-right: 1px dashed var(--line-strong);
    overflow: hidden;
  }

  /* paper stock: the same film grain the page already uses, held still */
  .stub::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.85 0 0 0 0 0.7 0 0 0 0 1 0 0 0 0.35 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.13;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .stub-month {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--glow);
    text-indent: 0.22em;
  }

  .stub-day {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 42px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--bone);
  }

  .stub-doors {
    margin-top: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.14em;
    color: var(--bone-faint);
    white-space: nowrap;
  }

  .ticket-body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 18px;
  }

  /* co-headlining gigs: equal height regardless of title length, CTAs aligned */
  .heroes {
    display: grid;
    grid-auto-rows: 1fr;
    gap: 12px;
  }

  .heroes .pinned-cta {
    margin-top: auto;
    align-self: flex-start;
  }

  .pinned:active { transform: scale(0.99); }
  @media (hover: hover) {
    .pinned:hover { border-color: var(--violet); }
  }

  .pinned-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    color: var(--glow);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--violet);
    box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7);
    animation: pulse 2.2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); }
    70% { box-shadow: 0 0 0 9px rgba(168, 85, 247, 0); }
    100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
  }

  .pinned-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.025em;
    line-height: 1.08;
    margin-bottom: 10px;
  }

  .pinned-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--bone-dim);
    letter-spacing: 0.08em;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .pinned-cta {
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--glow);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  /* ---- media cards & link rows ---- */

  .feature {
    display: block;
    text-decoration: none;
    color: inherit;
    margin-bottom: 14px;
    border: 1px solid var(--line);
    background: var(--ink-soft);
    overflow: hidden;
    transition: border-color 0.3s ease, transform 0.3s ease;
    opacity: 0;
    animation: rise 0.6s ease forwards;
  }

  .feature:active { transform: scale(0.99); }
  @media (hover: hover) {
    .feature:hover { border-color: var(--line-strong); }
    .feature:hover .feature-thumb img { transform: scale(1.03); }
    .feature:hover .feature-play { background: var(--violet); color: var(--bone); border-color: var(--violet); }
  }

  .feature-thumb {
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: var(--ink);
  }

  .feature-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .feature-thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(10, 6, 18, 0.7));
    pointer-events: none;
  }

  .feature-play {
    position: absolute;
    bottom: 14px;
    right: 14px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(240, 236, 245, 0.3);
    background: rgba(10, 6, 18, 0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bone);
    z-index: 2;
    transition: all 0.3s ease;
  }

  .feature-play::before {
    content: "";
    width: 0;
    height: 0;
    border-left: 9px solid currentColor;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    margin-left: 2px;
  }

  .feature-body { padding: 16px 18px 18px; }

  .feature-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: -0.015em;
    line-height: 1.25;
    margin-bottom: 4px;
  }

  .feature-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--bone-faint);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* ---- inline players (mixes) ---- */

  .embed-card {
    border: 1px solid var(--line);
    background: var(--ink-soft);
    margin-bottom: 14px;
    overflow: hidden;
    opacity: 0;
    animation: rise 0.6s ease forwards;
  }

  .embed-head { padding: 14px 18px 12px; }

  .embed-frame { background: var(--ink); }
  .embed-frame iframe { width: 100%; display: block; border: 0; }
  .embed-frame.audio iframe { height: 166px; }
  .embed-frame.video { aspect-ratio: 16/9; }
  .embed-frame.video iframe { height: 100%; }

  .embed-open {
    display: block;
    padding: 13px 18px;
    border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--glow);
    text-decoration: none;
    transition: background 0.25s ease;
  }

  .embed-open:active,
  .embed-open:hover { background: rgba(168, 85, 247, 0.08); }

  .links { display: flex; flex-direction: column; }

  .link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 4px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--bone);
    transition: padding 0.25s ease;
    position: relative;
    min-height: 56px;
    opacity: 0;
    animation: rise 0.5s ease forwards;
  }

  .link:active { padding-left: 10px; }
  @media (hover: hover) {
    .link:hover { padding-left: 10px; }
    .link:hover .link-title { color: var(--glow); }
    .link:hover .arrow { color: var(--violet); transform: translateX(4px); }
  }

  .link-text {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }

  .link-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 300;
    letter-spacing: -0.015em;
    transition: color 0.25s ease;
  }

  .link-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--bone-faint);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .arrow {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--bone-faint);
    transition: all 0.25s ease;
    flex-shrink: 0;
    margin-left: 16px;
  }

  /* ---- gig rows ---- */

  .gigs { display: flex; flex-direction: column; }

  .gig {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 4px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--bone);
    transition: padding 0.25s ease;
    min-height: 56px;
    opacity: 0;
    animation: rise 0.5s ease forwards;
  }

  a.gig:active { padding-left: 10px; }
  @media (hover: hover) {
    a.gig:hover { padding-left: 10px; }
    a.gig:hover .gig-venue { color: var(--glow); }
  }

  .gig-date {
    flex-shrink: 0;
    width: 52px;
    text-align: center;
    border-right: 1px solid var(--line-strong);
    padding-right: 16px;
  }

  .gig-month {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--violet);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .gig-day {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 300;
    line-height: 1;
    color: var(--bone);
  }

  .gig-info { flex: 1; min-width: 0; }

  .gig-venue {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: -0.015em;
    line-height: 1.2;
    margin-bottom: 4px;
    transition: color 0.25s ease;
  }

  .gig-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--bone-faint);
    letter-spacing: 0.14em;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .gig-cta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--glow);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .price-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    padding: 3px 8px;
    border: 1px solid currentColor;
    border-radius: 2px;
    line-height: 1;
  }

  .price-tag.free {
    color: var(--green);
    background: rgba(134, 239, 172, 0.08);
  }

  .price-tag.paid {
    color: var(--glow);
    background: rgba(216, 180, 254, 0.08);
  }

  /* set time — added the week of, once Shray knows when he's on */
  .set-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--glow);
    display: inline-flex;
    align-items: baseline;
    gap: 9px;
    padding: 6px 11px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    background: rgba(216, 180, 254, 0.06);
  }

  .set-time em {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0;
    color: var(--bone-faint);
  }

  .set-time-line { margin-bottom: 16px; }

  /* compact variant inside the smaller gig rows */
  .gig-meta .set-time {
    font-size: 9px;
    padding: 3px 8px;
    gap: 7px;
  }

  .gig-meta .set-time em { font-size: 10px; }

  /* teaser — a booked gig that isn't announced yet. Date leaks, nothing else. */
  .gig.teaser { cursor: default; }

  .redacted {
    display: inline-block;
    width: 136px;
    max-width: 52vw;
    height: 15px;
    border-radius: 2px;
    background: rgba(216, 180, 254, 0.16);
    position: relative;
    overflow: hidden;
    vertical-align: middle;
  }

  .redacted::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(240, 236, 245, 0.22), transparent);
    transform: translateX(-100%);
    animation: sweep 3.4s ease-in-out infinite;
  }

  @keyframes sweep {
    0%        { transform: translateX(-100%); }
    55%, 100% { transform: translateX(100%); }
  }

  .soon {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--ink);
    background: var(--glow);
    padding: 2px 8px;
    border-radius: 2px;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* ---- booking line ---- */

  .book {
    margin-top: 64px;
    text-align: center;
    opacity: 0;
    animation: rise 0.6s ease forwards;
  }

  .book-line {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 19px;
    color: var(--bone);
    margin-bottom: 14px;
  }

  .book-email {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .book-email a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--glow);
    text-decoration: none;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--line-strong);
    transition: border-color 0.25s ease;
    user-select: text;
    -webkit-user-select: text;
  }

  .book-email a:active,
  .book-email a:hover { border-color: var(--glow); }

  .copy-btn {
    width: 30px;
    height: 30px;
    padding: 5px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--bone-faint);
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    vertical-align: middle;
    position: relative;
  }

  /* keeps the 30px look, gives thumbs a 44px target */
  .copy-btn::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
  }

  .copy-btn svg { width: 16px; height: 16px; display: block; }
  .copy-btn:active { transform: scale(0.88); }
  @media (hover: hover) {
    .copy-btn:hover { color: var(--glow); background: rgba(168, 85, 247, 0.1); }
  }
  .copy-btn.copied { color: var(--green); }

  .book-dm {
    display: block;
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--bone-faint);
    text-decoration: none;
    transition: color 0.25s ease;
  }
  .book-dm:hover { color: var(--glow); }

  .empty {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 16px;
    color: var(--bone-faint);
    padding: 14px 4px;
    line-height: 1.5;
  }

  .error {
    padding: 40px 24px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--bone-dim);
    letter-spacing: 0.1em;
  }

  footer {
    margin-top: 64px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.28em;
    color: var(--bone-faint);
    opacity: 0;
    animation: rise 0.6s 1.2s ease forwards;
  }

  .divider {
    display: block;
    width: 24px;
    height: 1px;
    background: var(--line-strong);
    margin: 0 auto 18px;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 380px) {
    .content { padding: 0 20px; }
    /* the ticket keeps padding: 0 — the stub must stay flush to the edge.
       Shrink the stub instead so the title keeps usable width. */
    .pinned { --stub-w: 68px; --notch: 8px; }
    .ticket-body { padding: 16px 16px 15px; }
    .stub { padding: 14px 0; }
    .stub-day { font-size: 35px; }
    .stub-month { font-size: 9px; }
    .stub-doors { font-size: 7px; letter-spacing: 0.1em; }
    .pinned-title { font-size: 23px; }
    .link-title, .gig-venue { font-size: 17px; }
    .gig-date { width: 46px; padding-right: 12px; }
    .gig-day { font-size: 22px; }
    .header-block { margin-top: -62px; padding: 0 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
    }
  }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
  // ============================================================
  //  All your content lives in config.json.
  //  This file is the template — you shouldn't need to edit it.
  //
  //  The gigs array is the single source of truth. A gig counts as
  //  upcoming until 5 AM the morning after its date:
  //    - soonest upcoming gig      -> "up next" hero card
  //    - other upcoming gigs       -> "up next" rows
  //    - past gig with a setUrl    -> "live sets" (auto thumbnail)
  //    - past gig without one      -> not shown
  //
  //  socials: a plain list of profile URLs — the right icon is
  //  picked from the hostname (instagram / soundcloud / youtube).
  //
  //  mixes: individual track/video links — SoundCloud and YouTube
  //  URLs render inline players plus an "open in app" link.
  // ============================================================

  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else node.setAttribute(k, v);
    }
    children.flat().forEach(c => {
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  };

  const splitName = (name) => {
    const trimmed = name.trim();
    const parts = trimmed.split(/\s+/);
    if (parts.length > 1) return { first: parts[0], second: parts.slice(1).join(" "), joined: false };
    // One word ending in "way" (e.g. "shrayway") — italicise "way" with no space
    if (trimmed.length > 3 && trimmed.endsWith("way")) {
      return { first: trimmed.slice(0, -3), second: "way", joined: true };
    }
    return { first: trimmed, second: "", joined: false };
  };

  const getYouTubeId = (url) => {
    const patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  };

  const formatDate = (dateStr) => {
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const [y, m, d] = dateStr.split("-").map(Number);
    return { month: months[m - 1], day: String(d), year: String(y) };
  };

  // A gig stays in "up next" until 5 AM the morning after its date: sets can
  // run past midnight, and tickets still sell after doors open.
  const CUTOFF_HOUR = 5;

  const isUpcoming = (dateStr) => {
    const [y, m, d] = dateStr.split("-").map(Number);
    const cutoff = new Date(y, m - 1, d + 1, CUTOFF_HOUR, 0, 0, 0);
    return Date.now() < cutoff.getTime();
  };

  const daysUntil = (dateStr) => {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const [y, m, d] = dateStr.split("-").map(Number);
    const eventDate = new Date(y, m - 1, d);
    const days = Math.round((eventDate.getTime() - today.getTime()) / 86400000);
    // Goes negative in the small hours after a gig that's still running — still "tonight"
    return Math.max(0, days);
  };

  // "free" -> green tag; any other price string -> violet tag; empty -> none
  const renderPriceTag = (price) => {
    if (!price || !price.trim()) return null;
    const trimmed = price.trim();
    const isFree = trimmed.toLowerCase() === "free";
    return el("span", { class: `price-tag ${isFree ? "free" : "paid"}` },
      isFree ? "free" : trimmed
    );
  };

  // Optional "setTime" on a gig — usually added the week of, once it's known
  const renderSetTime = (g) => {
    if (!g.setTime || !g.setTime.trim()) return null;
    return el("span", { class: "set-time" },
      el("em", {}, "set time"),
      g.setTime.trim()
    );
  };

  // CTA derived from price: free -> rsvp, priced -> tickets.
  // Optional "cta" field on the gig overrides.
  const ctaLabel = (g) => {
    if (g.cta) return g.cta;
    const p = (g.price || "").trim().toLowerCase();
    if (p === "free") return "rsvp";
    if (p) return "tickets";
    return "details";
  };

  // ---- social icons (picked by hostname) ----

  const ICONS = {
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>',
    soundcloud: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="12.6" width="1.5" height="4.4" rx="0.75"/><rect x="3.7" y="11.2" width="1.5" height="5.8" rx="0.75"/><rect x="6.4" y="9.4" width="1.5" height="7.6" rx="0.75"/><rect x="9.1" y="10.2" width="1.5" height="6.8" rx="0.75"/><path d="M12.3 8.7c0-.27.19-.5.45-.56a5.6 5.6 0 0 1 6.65 4.1 3.3 3.3 0 0 1-.62 6.54h-6.03a.45.45 0 0 1-.45-.45z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.2 9.4l4.6 2.6-4.6 2.6z" fill="currentColor" stroke="none"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 14a5 5 0 0 0 7.1 0l2.4-2.4a5 5 0 0 0-7.1-7.1l-1.2 1.2"/><path d="M14 10a5 5 0 0 0-7.1 0l-2.4 2.4a5 5 0 0 0 7.1 7.1l1.2-1.2"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>'
  };

  const socialIcon = (url) => {
    if (/instagram\.com/i.test(url)) return { icon: ICONS.instagram, label: "Instagram" };
    if (/soundcloud/i.test(url)) return { icon: ICONS.soundcloud, label: "SoundCloud" };
    if (/youtu/i.test(url)) return { icon: ICONS.youtube, label: "YouTube" };
    return { icon: ICONS.link, label: "Link" };
  };

  // YouTube link -> thumbnail card; anything else -> link row
  const mediaItem = (title, sub, url, delay) => {
    const id = url ? getYouTubeId(url) : null;
    if (id) {
      // hqdefault works for all videos including unlisted; 0.jpg is fallback
      const thumb = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
      const fallback = `https://img.youtube.com/vi/${id}/0.jpg`;
      const card = el("a", {
        class: "feature",
        href: url,
        target: "_blank",
        rel: "noopener",
        style: `animation-delay: ${delay}s`
      });
      const thumbWrap = el("div", { class: "feature-thumb" });
      thumbWrap.appendChild(el("img", {
        src: thumb,
        alt: title,
        loading: "lazy",
        onerror: `this.onerror=null;this.src='${fallback}'`
      }));
      thumbWrap.appendChild(el("span", { class: "feature-play" }));
      card.appendChild(thumbWrap);
      const body = el("div", { class: "feature-body" });
      body.appendChild(el("div", { class: "feature-title" }, title));
      if (sub) body.appendChild(el("div", { class: "feature-sub" }, sub));
      card.appendChild(body);
      return card;
    }
    const link = el("a", {
      class: "link",
      href: url,
      target: "_blank",
      rel: "noopener",
      style: `animation-delay: ${delay}s`
    });
    const text = el("div", { class: "link-text" });
    text.appendChild(el("span", { class: "link-title" }, title));
    if (sub) text.appendChild(el("span", { class: "link-sub" }, sub));
    link.appendChild(text);
    link.appendChild(el("span", { class: "arrow" }, "→"));
    return link;
  };

  // Inline player for a mix: SoundCloud widget or YouTube embed,
  // with an "open in <app> →" handoff link. Other URLs -> link row.
  const mixItem = (m, delay) => {
    const ytId = getYouTubeId(m.url);
    const isSc = /soundcloud/i.test(m.url);
    if (!ytId && !isSc) return mediaItem(m.title, m.sub, m.url, delay);

    const card = el("div", { class: "embed-card", style: `animation-delay: ${delay}s` });
    const head = el("div", { class: "embed-head" });
    head.appendChild(el("div", { class: "feature-title" }, m.title));
    if (m.sub) head.appendChild(el("div", { class: "feature-sub" }, m.sub));
    card.appendChild(head);

    if (ytId) {
      const frame = el("div", { class: "embed-frame video" });
      frame.appendChild(el("iframe", {
        src: `https://www.youtube-nocookie.com/embed/${ytId}`,
        title: m.title,
        loading: "lazy",
        frameborder: "0",
        allow: "encrypted-media; picture-in-picture",
        allowfullscreen: ""
      }));
      card.appendChild(frame);
      card.appendChild(el("a", {
        class: "embed-open", href: m.url, target: "_blank", rel: "noopener"
      }, "open in youtube →"));
    } else {
      const frame = el("div", { class: "embed-frame audio" });
      frame.appendChild(el("iframe", {
        src: `https://w.soundcloud.com/player/?url=${encodeURIComponent(m.url)}&color=%23a855f7&auto_play=false&hide_related=true&show_comments=false&show_teaser=false`,
        title: m.title,
        loading: "lazy",
        frameborder: "0",
        allow: "autoplay"
      }));
      card.appendChild(frame);
      card.appendChild(el("a", {
        class: "embed-open", href: m.url, target: "_blank", rel: "noopener"
      }, "open in soundcloud →"));
    }
    return card;
  };

  // One gig row, used by "up next"
  const gigRow = (g, { delay = 0 } = {}) => {
    const { month, day } = formatDate(g.date);

    // Booked but not announced: show the date, redact everything else
    if (g.teaser) {
      const row = el("div", { class: "gig teaser", style: `animation-delay: ${delay}s` });
      const dateBox = el("div", { class: "gig-date" });
      dateBox.appendChild(el("div", { class: "gig-month" }, month));
      dateBox.appendChild(el("div", { class: "gig-day" }, day));
      row.appendChild(dateBox);
      const info = el("div", { class: "gig-info" });
      info.appendChild(el("div", { class: "gig-venue" }, el("span", { class: "redacted" })));
      info.appendChild(el("div", { class: "gig-meta" },
        el("span", {}, g.meta || "not announced yet")));
      row.appendChild(info);
      return row;
    }

    const attrs = { class: "gig", style: `animation-delay: ${delay}s` };
    if (g.url) {
      attrs.href = g.url;
      attrs.target = "_blank";
      attrs.rel = "noopener";
    }
    const gig = el(g.url ? "a" : "div", attrs);

    const dateBox = el("div", { class: "gig-date" });
    dateBox.appendChild(el("div", { class: "gig-month" }, month));
    dateBox.appendChild(el("div", { class: "gig-day" }, day));
    gig.appendChild(dateBox);

    const info = el("div", { class: "gig-info" });
    const venueLine = el("div", { class: "gig-venue" }, g.title || g.venue);
    const days = daysUntil(g.date);
    if (days <= 7) {
      const badgeText = days === 0 ? "tonight" : days === 1 ? "tomorrow" : "this week";
      venueLine.appendChild(el("span", { class: "soon" }, badgeText));
    }
    info.appendChild(venueLine);

    const metaParts = [];
    if (g.title && g.venue) metaParts.push(g.venue);
    if (g.meta) metaParts.push(g.meta);

    const metaLine = el("div", { class: "gig-meta" });
    if (metaParts.length) metaLine.appendChild(el("span", {}, metaParts.join(" · ")));
    const setTime = renderSetTime(g);
    if (setTime) metaLine.appendChild(setTime);
    const priceTag = renderPriceTag(g.price);
    if (priceTag) metaLine.appendChild(priceTag);
    if (metaLine.childNodes.length) info.appendChild(metaLine);
    gig.appendChild(info);

    if (g.url) {
      gig.appendChild(el("span", { class: "gig-cta" }, ctaLabel(g) + " →"));
    }
    return gig;
  };

  const render = (config) => {
    const app = document.getElementById("app");

    // Tab title tracks config; the og: tags are static in the head because
    // crawlers don't run this script.
    document.getElementById("page-title").textContent = `${config.name} — dj`;
    document.getElementById("page-desc")
      .setAttribute("content", `${config.name} · ${config.city}`);

    const { first, second, joined } = splitName(config.name);

    // Banner
    const banner = el("div", { class: "banner" });
    if (config.bannerImage) {
      banner.appendChild(el("img", { src: config.bannerImage, alt: config.name }));
    } else {
      banner.appendChild(el("div", { class: "banner-placeholder" }, "banner image"));
    }
    app.appendChild(banner);

    // Header — name + city + social icons
    const headerBlock = el("div", { class: "header-block" });
    const h1 = el("h1");
    h1.appendChild(document.createTextNode(first));
    if (second) {
      if (!joined) h1.appendChild(document.createTextNode(" "));
      h1.appendChild(el("em", {}, second));
    }
    headerBlock.appendChild(h1);

    if (config.socials && config.socials.length) {
      const socials = el("div", { class: "socials" });
      config.socials.forEach((url) => {
        const { icon, label } = socialIcon(url);
        socials.appendChild(el("a", {
          href: url,
          target: "_blank",
          rel: "noopener",
          "aria-label": label,
          html: icon
        }));
      });
      headerBlock.appendChild(socials);
    }
    app.appendChild(headerBlock);

    const content = el("div", { class: "content" });
    app.appendChild(content);

    // Split gigs by date — this drives the whole page
    const gigs = config.gigs || [];
    const upcoming = gigs.filter(g => isUpcoming(g.date)).sort((a, b) => a.date.localeCompare(b.date));
    const past = gigs.filter(g => !isUpcoming(g.date)).sort((a, b) => b.date.localeCompare(a.date));
    // Every pinned gig gets a full hero card (equal billing); with none pinned,
    // the soonest gig is the lone hero. Teasers have nothing to show, so never heroes.
    const pinnedGigs = upcoming.filter(g => g.pinned && !g.teaser);
    const soonest = upcoming.find(g => !g.teaser);
    const heroGigs = pinnedGigs.length ? pinnedGigs : (soonest ? [soonest] : []);
    const restUpcoming = upcoming.filter(g => !heroGigs.includes(g));
    // Past gigs survive only as live sets — a recording is what keeps them on the page
    const liveSets = past.filter(g => g.setUrl);

    let animDelay = 0.7;

    // When every upcoming gig belongs to one series (e.g. "halloweekend"), the
    // section takes that name; once they pass it reverts to "up next" by itself.
    const shared = (key) => upcoming.length && upcoming.every(g => g[key] && g[key] === upcoming[0][key])
      ? upcoming[0][key] : null;
    const series = shared("series");
    const NIGHTS = ["night one", "night two", "night three", "night four"];

    // up next — hero card + remaining rows, or a quiet empty line
    {
      const sec = el("section", { class: "section" });
      const upNextLabel = el("div", {
        class: "section-label",
        style: `animation-delay: ${animDelay}s`
      }, "up next");
      if (series) upNextLabel.appendChild(el("span", { class: "section-tag" }, series));
      sec.appendChild(upNextLabel);

      const heroes = el("div", { class: "heroes" });
      if (heroGigs.length) sec.appendChild(heroes);
      heroGigs.forEach((g, i) => {
        const days = daysUntil(g.date);
        // tonight/tomorrow always win; otherwise a multi-night series gets equal
        // "night one / night two" billing instead of "next show / coming up"
        const label = days === 0 ? "tonight" : days === 1 ? "tomorrow"
          : series && heroGigs.length > 1 && NIGHTS[i] ? NIGHTS[i]
          : days <= 7 ? "this week" : i === 0 ? "next show" : "coming up";
        const attrs = { class: "pinned", style: `animation-delay: ${animDelay}s` };
        if (g.url) {
          attrs.href = g.url;
          attrs.target = "_blank";
          attrs.rel = "noopener";
        }
        const pinned = el(g.url ? "a" : "div", attrs);
        const { month, day } = formatDate(g.date);

        // Every hero is a ticket: tear-off date stub, then the details
        const stub = el("div", { class: "stub" },
          el("div", { class: "stub-month" }, month),
          el("div", { class: "stub-day" }, day)
        );
        if (g.doors) stub.appendChild(el("div", { class: "stub-doors" }, `DOORS ${g.doors}`));
        pinned.appendChild(stub);
        const body = el("div", { class: "ticket-body" });
        pinned.appendChild(body);

        body.appendChild(el("div", { class: "pinned-label" },
          el("span", { class: "pulse" }),
          label
        ));
        body.appendChild(el("div", { class: "pinned-title" }, g.title || g.venue));

        // the stub already carries the date, so don't repeat it in the meta line
        const metaParts = [];
        if (g.title && g.venue) metaParts.push(g.venue);
        if (g.meta) metaParts.push(g.meta);
        const metaLine = el("div", { class: "pinned-meta" });
        if (metaParts.length) metaLine.appendChild(el("span", {}, metaParts.join(" · ")));
        const priceTag = renderPriceTag(g.price);
        if (priceTag) metaLine.appendChild(priceTag);
        if (metaLine.childNodes.length) body.appendChild(metaLine);

        const setTime = renderSetTime(g);
        if (setTime) body.appendChild(el("div", { class: "set-time-line" }, setTime));

        if (g.url) body.appendChild(el("div", { class: "pinned-cta" }, ctaLabel(g) + " →"));
        heroes.appendChild(pinned);
        animDelay += 0.1;
      });

      if (!heroGigs.length && !restUpcoming.length) {
        sec.appendChild(el("div", {
          class: "empty",
          style: `animation-delay: ${animDelay}s`
        }, "nothing right now… stay tuned"));
        animDelay += 0.1;
      }

      // Rows render with or without a hero — a teaser alone still fills the section
      if (restUpcoming.length) {
        const list = el("div", { class: "gigs" });
        restUpcoming.forEach((g2) => {
          list.appendChild(gigRow(g2, { delay: animDelay }));
          animDelay += 0.06;
        });
        sec.appendChild(list);
      }
      content.appendChild(sec);
    }

    // live sets — past gigs with recordings, newest first
    if (liveSets.length) {
      const sec = el("section", { class: "section section--live" });
      sec.appendChild(el("div", { class: "section-label", style: `animation-delay: ${animDelay}s` }, "live sets"));
      liveSets.forEach((g) => {
        const { month, year } = formatDate(g.date);
        const subParts = [];
        if (g.title && g.venue) subParts.push(g.venue);
        subParts.push(`${month} ${year}`);
        sec.appendChild(mediaItem(g.title || g.venue, subParts.join(" · "), g.setUrl, animDelay));
        animDelay += 0.08;
      });
      content.appendChild(sec);
    }

    // mixes — individual tracks with inline players
    const mixes = config.mixes || [];
    if (mixes.length) {
      const sec = el("section", { class: "section section--mixes" });
      sec.appendChild(el("div", { class: "section-label", style: `animation-delay: ${animDelay}s` }, "mixes"));
      mixes.forEach((m) => {
        sec.appendChild(mixItem(m, animDelay));
        animDelay += 0.08;
      });
      content.appendChild(sec);
    }

    // wanna book me? — email (mailto + copy icon) + IG DM
    if (config.booking && config.booking.email) {
      const email = config.booking.email;
      // detect IG URL from booking.instagram or socials array
      const igUrl = config.booking.instagram
        || (config.socials || []).find(u => /instagram\.com/i.test(u));

      const book = el("div", { class: "book", style: `animation-delay: ${animDelay}s` });
      book.appendChild(el("div", { class: "book-line" }, "contact me"));

      const row = el("div", { class: "book-email" });
      row.appendChild(el("a", { href: `mailto:${email}` }, email));

      const copyBtn = el("button", { class: "copy-btn", type: "button", "aria-label": "copy email", html: ICONS.copy });
      copyBtn.addEventListener("click", () => {
        const reset = () => {
          copyBtn.innerHTML = ICONS.copy;
          copyBtn.classList.remove("copied");
        };
        const done = () => {
          copyBtn.innerHTML = ICONS.check;
          copyBtn.classList.add("copied");
          setTimeout(reset, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email).then(done).catch(done);
        } else {
          const ta = document.createElement("textarea");
          ta.value = email;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(ta);
          done();
        }
      });
      row.appendChild(copyBtn);
      book.appendChild(row);

      if (igUrl) {
        book.appendChild(el("a", { class: "book-dm", href: igUrl, target: "_blank", rel: "noopener" }, "dm on ig →"));
      }

      content.appendChild(book);
      animDelay += 0.06;
    }

    // Footer
    const footer = el("footer");
    footer.appendChild(el("span", { class: "divider" }));
    footer.appendChild(document.createTextNode(`© ${new Date().getFullYear()} ${config.name}`));
    content.appendChild(footer);
  };

  const showError = (msg) => {
    const app = document.getElementById("app");
    app.appendChild(el("div", { class: "error" }, msg));
  };

  fetch("config.json?v=" + Date.now())
    .then(r => {
      if (!r.ok) throw new Error(`Failed to load config (${r.status})`);
      return r.json();
    })
    .then(render)
    .catch(err => {
      console.error(err);
      showError("Could not load site config. Check that config.json is valid JSON.");
    });
</script>

</body>
</html>
